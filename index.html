<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Generator</title>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
		<link rel="stylesheet" href="styles.css">
		<link rel="icon" href="favicon.ico" type="image/x-icon">
		<link rel="manifest" href="manifest.json">
	</head>
	<body>
		<main class="control-room">
			<section class="panel cores-panel" aria-label="Cores"></section>

			<section class="pool" aria-label="Reactor pool">
				<canvas class="pool-canvas"></canvas>
				<div class="readout" aria-live="off">
					<div class="readout-energy"><span class="readout-energy-value">0</span> <span class="readout-energy-unit">J</span></div>
					<div class="readout-rate"></div>
					<div class="readout-bank" hidden></div>
				</div>
				<p class="pool-hint" hidden></p>
				<div class="notices" aria-live="polite"></div>
				<button class="start-over" type="button">Start over</button>
			</section>

			<section class="panel works-panel" aria-label="Upgrades"></section>
		</main>
		<script src="build/game.js"></script>
	</body>
</html>
